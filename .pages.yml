media:
  input: assets/images/events
  output: assets/images/events
  extensions: [jpg, jpeg, png, webp]
  rename: safe
content:
  - name: events
    label: Events
    description: Each entry appears on the Events page once its last day has passed. Events go under Past Events and competitions go under Past Competitions.
    type: file
    path: events.json
    format: json
    fields:
      - name: events
        label: false
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({date})"
        fields:
          - name: title
            label: Event name
            type: string
            required: true
          - name: date
            label: Date (first day, if it runs over several days)
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: end_date
            label: Last day (only for multi-day events, otherwise leave empty)
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
          - name: time
            label: Time
            description: For example 7.30 pm, TBC or Two days
            type: string
          - name: venue
            label: Venue
            type: string
          - name: type
            label: Show under
            type: select
            default: Performance
            options:
              values:
                - name: Performance
                  label: Past Events
                - name: Competition
                  label: Past Competitions
          - name: description
            label: Description
            description: Shown when someone clicks the event. Leave a blank line between paragraphs.
            type: text
          - name: images
            label: Photos
            description: Optional. The first photo also shows on the event card. Photos under 1 MB load fastest.
            type: image
            options:
              multiple:
                max: 12
          - name: status
            label: Badge text
            description: Short label on the event card, for example Confirmed, Overseas or Charity
            type: string
          - name: colour
            label: Badge colour
            type: select
            default: neutral
            options:
              values:
                - name: success
                  label: Green (confirmed)
                - name: accent
                  label: Gold (highlight)
                - name: neutral
                  label: Grey (general)